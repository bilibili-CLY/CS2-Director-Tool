<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔女杯导播工具</title>
<style>
    :root {
        --primary: #C41E3A;
        --primary-hover: #D93A54;
        --primary-pressed: #A0172F;
        --primary-disabled: #5A3A40;
        --accent: #FFD700;
        --bg: #141414;
        --sidebar: #191919;
        --surface: #1F1F1F;
        --surface-border: #2E2E2E;
        --input-bg: #161616;
        --text-primary: #ECECEC;
        --text-secondary: #9E9E9E;
        --text-disabled: #5C5C5C;
        --success: #66BB6A;
        --error: #EF5350;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        background: #000;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text-primary);
        overflow: hidden;
    }

    body { display: flex; align-items: center; justify-content: center; }

    .app {
        width: 1200px;
        height: 720px;
        min-width: 800px;
        min-height: 480px;
        max-width: 100vw;
        max-height: 100vh;
        background: var(--bg);
        display: grid;
        grid-template-columns: 220px 1fr;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,.6);
        border-radius: 8px;
    }

    /* ================= 侧边栏 ================= */
    .sidebar {
        background: var(--sidebar);
        display: flex;
        flex-direction: column;
    }

    .sidebar-header { padding: 28px 20px 20px; }
    .sidebar-header h1 { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .sidebar-header p { font-size: 10px; font-weight: 500; color: var(--text-secondary); margin-top: 4px; }

    .sidebar-divider { height: 1px; background: var(--surface-border); }

    .nav { margin-top: 12px; display: flex; flex-direction: column; }

    .sidebar-tab {
        position: relative;
        display: block;
        width: calc(100% - 16px);
        margin: 2px 8px;
        padding: 0 16px;
        height: 44px;
        background: transparent;
        border: none;
        border-radius: 6px;
        font-family: inherit;
        font-size: 15px;
        text-align: left;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background .15s ease, color .15s ease;
    }

    .sidebar-tab .accent {
        position: absolute;
        left: 16px; top: 50%;
        transform: translateY(-50%);
        width: 3px; height: 20px;
        border-radius: 1.5px;
        background: var(--primary);
        opacity: 0;
        transition: opacity .15s ease;
    }

    .sidebar-tab span.label { display: inline-block; margin-left: 16px; line-height: 44px; }

    .sidebar-tab:hover { background: #262626; }
    .sidebar-tab:active { background: #2E2E2E; }

    .sidebar-tab.selected {
        background: rgba(196, 30, 58, .15);
        color: var(--text-primary);
    }
    .sidebar-tab.selected:hover { background: #3A3A3A; }
    .sidebar-tab.selected:active { background: #3F3F3F; }
    .sidebar-tab.selected .accent { opacity: 1; }

    /* ================= 内容区 ================= */
    .content { position: relative; overflow: hidden; }

    .page {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: 28px 32px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s cubic-bezier(.4,0,.2,1);
    }
    .page.active { opacity: 1; pointer-events: auto; }

    .page::-webkit-scrollbar { width: 10px; }
    .page::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
    .page::-webkit-scrollbar-thumb:hover { background: #3d3d3d; }

    .page-title { font-size: 26px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }

    .card {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,.22);
    }

    .section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; }
    .label-text { font-size: 13px; color: var(--text-secondary); align-self: center; }
    .caption-text { font-size: 12px; color: var(--text-secondary); margin-top: 8px; min-height: 14px; word-break: break-all; }
    .status-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; align-self: center; }

    /* ================= 控件 ================= */
    .row { display: flex; gap: 8px; }
    .row > .grow { flex: 1; }

    .input {
        width: 100%;
        height: 38px;
        padding: 0 10px;
        background: var(--input-bg);
        border: 1px solid #3A3A3A;
        border-radius: 6px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        caret-color: var(--primary);
        outline: none;
        transition: border-color .15s ease;
    }
    .input:hover { border-color: #4A4A4A; }
    .input:focus { border-color: var(--primary); }
    .input::placeholder { color: var(--text-disabled); }

    .form-grid { display: grid; grid-template-columns: 64px 1fr; column-gap: 12px; row-gap: 12px; margin-bottom: 16px; }
    .form-grid.wide { grid-template-columns: 88px 1fr; }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        min-height: 38px;
        padding: 6px 16px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 6px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        transition: background .15s ease, border-color .15s ease, transform .08s ease;
    }
    .btn:hover { background: #2A2A2A; border-color: #3D3D3D; }
    .btn:active { background: #232323; transform: scale(.96); }
    .btn:disabled {
        background: #1A1A1A;
        border-color: #242424;
        color: var(--text-disabled);
        cursor: default;
        transform: none;
    }

    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn.primary:active { background: var(--primary-pressed); }
    .btn.primary:disabled { background: var(--primary-disabled); border-color: var(--primary-disabled); color: var(--text-disabled); }

    .btn.small { min-width: 0; min-height: 0; padding: 6px 14px; }

    /* 开关复选框 */
    .toggle {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        user-select: none;
    }
    .toggle input { display: none; }

    .toggle .box {
        width: 22px; height: 22px;
        border: 2px solid var(--surface-border);
        border-radius: 4px;
        background: var(--input-bg);
        display: flex; align-items: center; justify-content: center;
        transition: background .15s ease, border-color .15s ease;
        flex-shrink: 0;
    }
    .toggle .check {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        opacity: 0;
        transform: scale(.5);
        transition: opacity .15s ease, transform .15s ease;
    }
    .toggle:hover:not(.checked) .box { background: #1E1E1E; border-color: #3D3D3D; }
    .toggle.checked .box { background: var(--primary); border-color: var(--primary); }
    .toggle.checked .check { opacity: 1; transform: scale(1); }
    .toggle.checked:hover .box { background: var(--primary-hover); border-color: var(--primary-hover); }
    .toggle:active .box { transform: none; }

    /* 进度条 */
    .progress-wrap { flex: 1; align-self: center; display: none; }
    .progress-wrap.show { display: block; }
    .progressbar {
        height: 4px;
        background: var(--surface);
        border-radius: 2px;
        overflow: hidden;
    }
    .progressbar .fill {
        height: 100%;
        width: 0%;
        background: var(--primary);
        border-radius: 2px;
        transition: width .2s ease;
    }

    /* 日志控制台 */
    .log-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }
    .log-header .section-title { margin-bottom: 0; }
    .log-console {
        height: 260px;
        padding: 8px 10px;
        background: var(--input-bg);
        border: 1px solid var(--surface-border);
        border-radius: 6px;
        font-family: Consolas, Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: var(--text-secondary);
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
    }
    .log-console::-webkit-scrollbar { width: 10px; }
    .log-console::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }

    .disabled-group { opacity: .45; pointer-events: none; }

    .connect-row { display: flex; gap: 12px; align-items: center; }

    @media (max-width: 860px) {
        .app { grid-template-columns: 180px 1fr; min-width: 0; }
    }
</style>
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>魔女杯</h1>
            <p>MAJO CUP</p>
        </div>
        <div class="sidebar-divider"></div>
        <nav class="nav">
            <button class="sidebar-tab selected" data-page="home"><span class="accent"></span><span class="label">主页</span></button>
            <button class="sidebar-tab" data-page="killReplay"><span class="accent"></span><span class="label">击杀回放</span></button>
            <button class="sidebar-tab" data-page="pauseMusic"><span class="accent"></span><span class="label">暂停音乐</span></button>
            <button class="sidebar-tab" data-page="playerRename"><span class="accent"></span><span class="label">玩家改名</span></button>
        </nav>
    </aside>

    <main class="content">

        <!-- 主页 -->
        <section class="page active" id="page-home">
            <div class="page-title">主 页</div>
            <div class="page-subtitle">配置 CS2 / FFmpeg / OBS Studio</div>

            <div class="card">
                <div class="section-title">CS2 路径</div>
                <div class="row">
                    <input class="input grow" id="cs2Path" spellcheck="false">
                    <button class="btn" id="browseCs2">浏览</button>
                    <button class="btn primary" id="installGsi">安装 GSI</button>
                </div>
                <div class="caption-text" id="gsiStatus"></div>
            </div>

            <div class="card">
                <div class="section-title">FFmpeg 路径</div>
                <div class="row">
                    <input class="input grow" id="ffmpegPath" spellcheck="false">
                    <button class="btn" id="browseFfmpeg">浏览</button>
                </div>
            </div>

            <div class="card">
                <div class="section-title">OBS Studio WebSocket</div>
                <div class="form-grid">
                    <div class="label-text">IP:</div>
                    <input class="input" id="obsAddress" spellcheck="false">
                    <div class="label-text">端口:</div>
                    <input class="input" id="obsPort" spellcheck="false">
                    <div class="label-text">密码:</div>
                    <input class="input" id="obsPassword" type="password">
                </div>
                <div class="connect-row">
                    <button class="btn primary" id="toggleObs">连接</button>
                    <div class="status-text" id="obsStatus">未连接</div>
                </div>
            </div>
        </section>

        <!-- 击杀回放 -->
        <section class="page" id="page-killReplay">
            <div class="page-title">局内击杀回放</div>
            <div class="page-subtitle">自动记录击杀并生成回放片段</div>

            <div class="card">
                <label class="toggle" data-log="已启用击杀回放|已取消启用击杀回放" data-target="killReplayGroup" data-logbox="killReplayLog">
                    <input type="checkbox">
                    <span class="box"><span class="check">✓</span></span>
                    启用击杀回放
                </label>
                <div style="display:flex; gap:12px; margin-top:16px;">
                    <div class="status-text" id="killReplayStatus"></div>
                    <div class="progress-wrap" id="killReplayProgressWrap">
                        <div class="progressbar"><div class="fill" id="killReplayProgressFill"></div></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="form-grid wide disabled-group" id="killReplayGroup">
                    <div class="label-text">游戏场景:</div>
                    <input class="input" id="gameScene" spellcheck="false">
                    <div class="label-text">回放场景:</div>
                    <input class="input" id="replayScene" spellcheck="false">
                    <div class="label-text">回放媒体源:</div>
                    <input class="input" id="replaySource" value="Replay" spellcheck="false">
                </div>
            </div>

            <div class="card">
                <div class="log-header">
                    <div class="section-title">日志</div>
                    <button class="btn small" data-clear="killReplayLog">清空</button>
                </div>
                <div class="log-console" id="killReplayLog"></div>
            </div>
        </section>

        <!-- 暂停音乐 -->
        <section class="page" id="page-pauseMusic">
            <div class="page-title">暂停音乐</div>
            <div class="page-subtitle">游戏暂停时自动播放背景音乐，暂停结束自动停止</div>

            <div class="card">
                <label class="toggle" data-log="已启用暂停音乐|已取消启用暂停音乐">
                    <input type="checkbox">
                    <span class="box"><span class="check">✓</span></span>
                    启用暂停音乐
                </label>
                <div class="status-text" id="pauseMusicStatus" style="margin-top:16px;"></div>
            </div>

            <div class="card">
                <div class="form-grid wide disabled-group" id="pauseMusicGroup">
                    <div class="label-text">音乐源名:</div>
                    <input class="input" id="musicSource" spellcheck="false">
                </div>
            </div>

            <div class="card">
                <div class="log-header">
                    <div class="section-title">日志</div>
                    <button class="btn small" data-clear="pauseMusicLog">清空</button>
                </div>
                <div class="log-console" id="pauseMusicLog"></div>
            </div>
        </section>

        <!-- 玩家改名 -->
        <section class="page" id="page-playerRename">
            <div class="page-title">玩家改名</div>
            <div class="page-subtitle">将游戏内所有玩家名修改为网站登记的名字</div>

            <div class="card">
                <button class="btn primary" id="getCommands" style="align-self:flex-start;">获取命令</button>
                <div class="status-text" id="playerRenameStatus" style="margin-top:16px;"></div>
            </div>
        </section>

    </main>
</div>

<script>
(function () {
    'use strict';

    function pad(n, len) { return String(n).padStart(len, '0'); }
    function now() {
        const d = new Date();
        return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
    }

    /* ---------- 标签页导航与交叉淡入淡出 ---------- */
    const tabs = document.querySelectorAll('.sidebar-tab');
    const pages = document.querySelectorAll('.page');
    let currentPage = 'home';

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.page;
            if (target === currentPage) return;
            tabs.forEach(t => t.classList.toggle('selected', t === tab));
            pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + target));
            currentPage = target;
        });
    });

    /* ---------- 日志控制台辅助函数 ---------- */
    function appendLog(boxId, message) {
        const box = document.getElementById(boxId);
        if (!box) return;
        const line = document.createElement('div');
        line.textContent = now() + ' ' + message;
        box.appendChild(line);
        while (box.childElementCount > 1000) box.removeChild(box.firstChild);
        box.scrollTop = box.scrollHeight;
    }

    document.querySelectorAll('[data-clear]').forEach(btn => {
        btn.addEventListener('click', () => {
            const box = document.getElementById(btn.dataset.clear);
            if (box) box.innerHTML = '';
        });
    });

    /* ---------- 开关复选框 ---------- */
    document.querySelectorAll('.toggle').forEach(toggle => {
        const input = toggle.querySelector('input[type=checkbox]');
        input.addEventListener('change', () => {
            toggle.classList.toggle('checked', input.checked);
            const groupId = toggle.dataset.target;
            if (groupId) document.getElementById(groupId).classList.toggle('disabled-group', !input.checked);
            const pair = (toggle.dataset.log || '').split('|');
            if (pair.length === 2 && toggle.dataset.logbox) {
                appendLog(toggle.dataset.logbox, input.checked ? pair[0] : pair[1]);
            }
        });
    });

    /* ---------- 浏览（演示） ---------- */
    document.getElementById('browseCs2').addEventListener('click', () => {
        document.getElementById('cs2Path').value = 'D:\\SteamLibrary\\steamapps\\common\\Counter-Strike Global Offensive\\game\\bin\\win64\\cs2.exe';
    });
    document.getElementById('browseFfmpeg').addEventListener('click', () => {
        document.getElementById('ffmpegPath').value = 'D:\\Tools\\ffmpeg\\bin\\ffmpeg.exe';
    });

    /* ---------- 安装 GSI（模拟） ---------- */
    let gsiInstalled = false;
    const installBtn = document.getElementById('installGsi');
    installBtn.addEventListener('click', () => {
        const path = document.getElementById('cs2Path').value.trim();
        const status = document.getElementById('gsiStatus');
        if (!path) { status.textContent = '错误: 请先填写 CS2 路径'; return; }
        installBtn.disabled = true;
        setTimeout(() => {
            gsiInstalled = true;
            installBtn.textContent = '重新安装 GSI';
            installBtn.disabled = false;
            status.textContent = 'GSI 已安装';
        }, 500);
    });

    /* ---------- OBS WebSocket（模拟） ---------- */
    let obsConnected = false;
    const obsBtn = document.getElementById('toggleObs');
    const obsStatus = document.getElementById('obsStatus');

    obsBtn.addEventListener('click', () => {
        const addr = document.getElementById('obsAddress').value.trim();
        const port = document.getElementById('obsPort').value.trim();
        if (!addr || !port) return;

        if (obsConnected) {
            obsConnected = false;
            obsBtn.textContent = '连接';
            obsStatus.textContent = '未连接';
            return;
        }
        obsBtn.disabled = true;
        obsStatus.textContent = '连接中...';
        setTimeout(() => {
            obsBtn.disabled = false;
            obsConnected = true;
            obsBtn.textContent = '断开';
            obsStatus.textContent = '已连接';
        }, 600);
    });

    /* ---------- 击杀回放演示流程 ---------- */
    let demoTimer = null;
    const krToggleInput = document.querySelector('#page-killReplay .toggle input');

    krToggleInput.addEventListener('change', () => {
        const wrap = document.getElementById('killReplayProgressWrap');
        const fill = document.getElementById('killReplayProgressFill');
        const status = document.getElementById('killReplayStatus');
        clearInterval(demoTimer);

        if (!krToggleInput.checked) {
            wrap.classList.remove('show');
            fill.style.width = '0%';
            status.textContent = '';
            return;
        }

        const stages = [
            ['对局开始，等待回合开始...', 900],
            ['新回合开始，等待击杀...', 1400],
            ['击杀: player1 击杀 player2 (时间: 23.4s)', 1600],
            ['回合结束，处理 1 个击杀镜头...', 1200]
        ];
        let i = 0;
        wrap.classList.add('show');

        function step() {
            if (i >= stages.length) {
                status.textContent = '';
                wrap.classList.remove('show');
                fill.style.width = '0%';
                return;
            }
            status.textContent = stages[i][0];
            fill.style.width = Math.round(((i + 1) / (stages.length + 1)) * 100) + '%';
            appendLog('killReplayLog', stages[i][0]);
            demoTimer = setTimeout(step, stages[i][1]);
            i++;
        }
        step();
    });

    /* ---------- 玩家改名（模拟） ---------- */
    document.getElementById('getCommands').addEventListener('click', () => {
        const btn = document.getElementById('getCommands');
        const status = document.getElementById('playerRenameStatus');
        btn.disabled = true;
        setTimeout(() => {
            btn.disabled = false;
            status.textContent = '未获取到 GSI 玩家数据，请确认 CS2 已在运行且 GSI 生效后再试';
        }, 400);
    });
})();
</script>
</body>
</html>
